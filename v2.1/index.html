function intelDash(b) {
  var D = INTEL.data, F = INTEL.f;
  var acts = ['HUB', 'L1', 'L2', 'L3', 'FINAL'];
  var stuMap = {}; D.students.forEach(function (s) { stuMap[s.studentId] = s; });
  var studs = D.students.filter(function (s) { return (!F.cls || s.className === F.cls) && (!F.sid || s.studentId === F.sid); });
  var sidSet = {}; studs.forEach(function (s) { sidSet[s.studentId] = 1; });
  var from = F.from ? new Date(F.from + 'T00:00:00') : null, to = F.to ? new Date(F.to + 'T23:59:59') : null;
  var att = D.attempts.filter(function (a) { var t = new Date(a.createdAt);
    return sidSet[a.studentId] && (!F.act || a.activity === F.act) && (!from || t >= from) && (!to || t <= to); });
  var mean = function (arr) { return arr.length ? arr.reduce(function (x, y) { return x + y; }, 0) / arr.length : 0; };
  var participants = {}; att.forEach(function (a) { participants[a.studentId] = 1; });
  var completedAtt = att.filter(function (a) { return a.completed; });
  var sumC = att.reduce(function (x, a) { return x + a.correct; }, 0), sumW = att.reduce(function (x, a) { return x + a.wrong; }, 0);
  var doneBy = {}; att.forEach(function (a) { if (a.completed) { doneBy[a.activity] = doneBy[a.activity] || {}; doneBy[a.activity][a.studentId] = 1; } });
  var tried = {}; att.forEach(function (a) { tried[a.activity] = tried[a.activity] || {}; tried[a.activity][a.studentId] = 1; });
  var nReg = studs.length, cnt = function (o) { return o ? Object.keys(o).length : 0; };
  var perAct = acts.map(function (k) { var A = att.filter(function (a) { return a.activity === k; });
    return { k: k, n: A.length, avg: Math.round(mean(A.map(function (a) { return a.percent; }))), time: Math.round(mean(A.filter(function (a) { return a.completed; }).map(function (a) { return a.durationSec; }))), done: cnt(doneBy[k]), tried: cnt(tried[k]) }; });
  var empty = !D.students.length;

  var html = (INTEL.sample ? '<div class="sample-banner">⚠ SAMPLE / TEST DATA — NOT REAL STUDENT RESULTS</div>' : '') +
    '<div class="row" style="margin-bottom:8px"><span class="chip ' + (INTEL.sample ? 'gold' : '') + '">' + (INTEL.sample ? 'Mod demonstrasi' : '🔓 Akses guru disahkan pelayan') + '</span><span class="spacer"></span>' +
    (INTEL.sample ? '' : '<button class="btn sm" id="iRefresh">↻ Muat semula</button>') + '<button class="btn sm" id="iCsvA">⬇ CSV percubaan</button><button class="btn sm" id="iCsvS">⬇ CSV ringkasan murid</button><button class="btn sm danger" id="iOut">' + (INTEL.sample ? 'Tutup demo' : 'Log keluar guru') + '</button></div>' +
    '<p class="small muted">Kemas kini terakhir pangkalan data: <b>' + (D.lastUpdate ? fmtDate(D.lastUpdate) : 'tiada rekod') + '</b> · Data dimuat: ' + fmtDate(D.serverTime) + '</p>' +
    (INTEL.sample ? '' : '<p class="small muted">✔ Semua markah di sini dikira dan disahkan oleh pelayan daripada jawapan murid (v2.1).' +
      (D.unverifiedCount ? ' <b>' + D.unverifiedCount + '</b> rekod lama yang tidak disahkan (contohnya dari v2) dikecualikan.' : '') + '</p>');
  if (empty) { b.innerHTML = html + '<div class="empty-state"><h3>No student records available yet.</h3><p>Belum ada murid berdaftar. Data akan muncul selepas murid mendaftar di Agent Identity dan bermain.</p></div><h2>Analisis Maklum Balas</h2>' + feedbackReport(D.feedback, true); bindIntel(b); return; }

  html += '<div class="filters card" style="padding:14px"><div><label for="fCls">Kelas</label><select class="input" id="fCls"><option value="">Semua</option>' + CONFIG.CLASSES.map(function (c) { return '<option' + (F.cls === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fSid">Murid</label><select class="input" id="fSid"><option value="">Semua</option>' + D.students.filter(function (s) { return !F.cls || s.className === F.cls; }).map(function (s) { return '<option value="' + esc(s.studentId) + '"' + (F.sid === s.studentId ? ' selected' : '') + '>' + esc(s.realName + ' (' + s.agentName + ')') + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fAct">Level / aktiviti</label><select class="input" id="fAct"><option value="">Semua</option>' + acts.map(function (a) { return '<option value="' + a + '"' + (F.act === a ? ' selected' : '') + '>' + esc(ACT_LABEL[a]) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fFrom">Dari tarikh</label><input class="input" type="date" id="fFrom" value="' + esc(F.from) + '"></div><div><label for="fTo">Hingga tarikh</label><input class="input" type="date" id="fTo" value="' + esc(F.to) + '"></div>' +
    '<div style="flex:0"><button class="btn sm" id="fReset">Set semula</button></div></div>';

  html += '<div class="grid g4">' + [
    ['1. Murid berdaftar', nReg], ['2. Murid yang menyertai', cnt(participants), pct(cnt(participants), nReg) + '% daripada berdaftar'], ['3. Aktiviti selesai', completedAtt.length],
    ['4. Purata markah', att.length ? Math.round(mean(att.map(function (a) { return a.percent; }))) + '%' : '-'],
    ['5. Jawapan betul', pct(sumC, sumC + sumW) + '%', sumC + ' jawapan'], ['6. Jawapan salah', pct(sumW, sumC + sumW) + '%', sumW + ' jawapan'],
    ['10. Bilangan percubaan', att.length], ['11. Purata masa selesai', completedAtt.length ? fmtDur(mean(completedAtt.map(function (a) { return a.durationSec; }))) : '-'],
    ['12. Final Boss selesai', pct(cnt(doneBy.FINAL), nReg) + '%', cnt(doneBy.FINAL) + ' / ' + nReg + ' murid · ' + cnt(tried.FINAL) + ' mencuba'],
    ['14. Kemas kini terakhir', D.lastUpdate ? fmtDate(D.lastUpdate).split(' ').slice(0, 3).join(' ') : '-']
  ].map(function (s) { return '<div class="card stat"><div class="k">' + s[0] + '</div><div class="v">' + s[1] + '</div>' + (s[2] ? '<div class="s">' + s[2] + '</div>' : '') + '</div>'; }).join('') + '</div>';

  if (!att.length) html += '<div class="empty-state" style="margin-top:16px">Tiada rekod aktiviti untuk penapis ini.</div>';
  else {
    html += '<div class="grid g2" style="margin-top:16px"><div class="card"><h3>8 & 9. Prestasi mengikut level / permainan (purata %)</h3>' +
      hBar(perAct.map(function (p) { return { label: ACT_LABEL[p.k].split(' — ')[0], value: p.avg, text: p.n ? p.avg + '% · ' + p.n + ' percubaan' : 'tiada data' }; }), { max: 100, title: 'Purata markah setiap aktiviti' }) + '</div>' +
      '<div class="card"><h3>5 & 6. Jawapan betul vs salah</h3>' + donut([{ label: 'Betul', value: sumC, color: CHART_COL.good }, { label: 'Salah', value: sumW, color: CHART_COL.bad }], { center: pct(sumC, sumC + sumW) + '%', centerLabel: 'betul', title: 'Peratus jawapan betul dan salah' }) + '</div></div>' +
      '<div class="grid g2" style="margin-top:16px"><div class="card"><h3>7. Kadar penyelesaian level (% murid berdaftar)</h3>' +
      hBar(['L1', 'L2', 'L3', 'FINAL'].map(function (k) { return { label: k === 'FINAL' ? 'Final Mission' : 'Level ' + k[1], value: pct(cnt(doneBy[k]), nReg), text: pct(cnt(doneBy[k]), nReg) + '% (' + cnt(doneBy[k]) + ')', color: CHART_COL.s3 }; }), { max: 100, title: 'Perkembangan level' }) + '</div>' +
      '<div class="card"><h3>Perbandingan kelas (purata %)</h3>' + groupBar(['Hub', 'L1', 'L2', 'L3', 'Final'], CONFIG.CLASSES.map(function (c, ci) {
        return { name: c, color: [CHART_COL.s1, CHART_COL.s2, CHART_COL.s3][ci], values: acts.map(function (k) { var A = att.filter(function (a) { return a.activity === k && stuMap[a.studentId] && stuMap[a.studentId].className === c; }); return A.length ? Math.round(mean(A.map(function (a) { return a.percent; }))) : null; }) }; }), { title: 'Perbandingan purata markah mengikut kelas' }) + '</div></div>';
    html += '<h3>Ringkasan setiap aktiviti</h3><div class="table-wrap"><table><thead><tr><th>Aktiviti</th><th>Percubaan</th><th>Murid mencuba</th><th>Murid selesai</th><th>Purata %</th><th>Purata masa selesai</th></tr></thead><tbody>' +
      perAct.map(function (p) { return '<tr><td>' + esc(ACT_LABEL[p.k]) + '</td><td>' + p.n + '</td><td>' + p.tried + '</td><td>' + p.done + '</td><td>' + (p.n ? p.avg + '%' : '-') + '</td><td>' + (p.done ? fmtDur(p.time) : '-') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  // jadual penyelesaian setiap murid (rekod individu — guru sahaja)
  html += '<h2>Rekod Murid (guru sahaja)</h2><div class="table-wrap"><table><thead><tr><th>Murid</th><th>Nama Ejen</th><th>Kelas</th>' + acts.map(function (a) { return '<th>' + (a === 'FINAL' ? 'Final' : a) + '</th>'; }).join('') + '<th>Mata</th><th>Aktif terakhir</th><th></th></tr></thead><tbody>' +
    studs.map(function (s) { var pts = 0;
      var cells = acts.map(function (k) { var A = D.attempts.filter(function (a) { return a.studentId === s.studentId && a.activity === k; }); if (!A.length) return '<td class="muted">—</td>';
        var best = Math.max.apply(null, A.map(function (a) { return a.score; })); pts += best; var dn = A.some(function (a) { return a.completed; });
        return '<td>' + (dn ? '✓ ' : '') + best + '<span class="small muted"> (' + A.length + 'x)</span></td>'; }).join('');
      return '<tr><td><b>' + esc(s.realName) + '</b><br><span class="small muted">' + esc(s.studentId) + '</span></td><td>' + esc(s.agentName) + '</td><td>' + esc(s.className) + '</td>' + cells + '<td><b>' + pts + '</b></td><td class="small">' + fmtDate(s.lastActive) + '</td><td>' +
        (INTEL.sample ? '' : '<button class="btn sm" data-reset="' + esc(s.studentId) + '">Set semula kod</button>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  html += '<h2>13. Analisis Maklum Balas</h2>' + feedbackReport(D.feedback, true);
  b.innerHTML = html; bindIntel(b);
}

function bindIntel(b) {
  var F = INTEL.f;
  function on(id, ev, fn) { var el = $(id, b); if (el) el.addEventListener(ev, fn); }
  on('#fCls', 'change', function (e) { F.cls = e.target.value; F.sid = ''; intelDash(b); });
  on('#fSid', 'change', function (e) { F.sid = e.target.value; intelDash(b); });
  on('#fAct', 'change', function (e) { F.act = e.target.value; intelDash(b); });
  on('#fFrom', 'change', function (e) { F.from = e.target.value; intelDash(b); });
  on('#fTo', 'change', function (e) { F.to = e.target.value; intelDash(b); });
  on('#fReset', 'click', function () { INTEL.f = { cls: '', sid: '', act: '', from: '', to: '' }; intelDash(b); });
  on('#iRefresh', 'click', function (e) { e.target.disabled = true; loadIntel().then(function () { toast('Data dikemas kini ✓', 'ok'); intelDash(b); }).catch(function (er) { toast(er.message, 'bad'); if (er.code === 'TEACHER_ONLY') { INTEL.data = null; intelLogin(b); } else e.target.disabled = false; }); });
  on('#iOut', 'click', function () { if (!INTEL.sample && STATE.teacherToken) API.call('teacherLogout', { teacherToken: STATE.teacherToken }).catch(function () {});
    STATE.teacherToken = null; INTEL.data = null; INTEL.sample = false; intelLogin(b); });
  on('#iCsvA', 'click', function () { exportCSV('attempts'); });
  on('#iCsvS', 'click', function () { exportCSV('students'); });
  $$('[data-reset]', b).forEach(function (btn) { btn.addEventListener('click', function () {
    var sid = btn.dataset.reset;
    var m = modal('<h3 style="margin-top:0">Set semula kod akses?</h3><p>Kod akses baharu akan dijana untuk <b>' + esc(sid) + '</b>. Kod lama tidak lagi boleh digunakan.</p><div class="row center"><button class="btn" data-close>Batal</button><button class="btn gold" id="rsYes">Jana kod baharu</button></div>');
    $('#rsYes', m.el).addEventListener('click', function (ev) { ev.target.disabled = true;
      API.call('teacherResetCode', { teacherToken: STATE.teacherToken, studentId: sid }).then(function (d) { m.close(); modal('<h3 style="margin-top:0">Kod baharu</h3><p>ID Ejen</p><div class="code-box">' + esc(d.studentId) + '</div><p>Kod akses</p><div class="code-box">' + esc(d.accessCode) + '</div><p class="small muted">Berikan kepada murid secara peribadi.</p><div class="row center"><button class="btn primary" data-close>Tutup</button></div>'); })
        .catch(function (er) { m.close(); toast(er.message, 'bad'); }); });
  }); });
}

function exportCSV(kind) {
  var D = INTEL.data; if (!D) return;
  var stu = {}; D.students.forEach(function (s) { stu[s.studentId] = s; });
  var rows;
  if (kind === 'attempts') rows = [['attemptId', 'studentId', 'realName', 'agentName', 'className', 'activity', 'score', 'maxScore', 'correct', 'wrong', 'durationSec', 'completed', 'createdAt']]
    .concat(D.attempts.map(function (a) { var s = stu[a.studentId] || {}; return [a.attemptId, a.studentId, s.realName, s.agentName, a.className, a.activity, a.score, a.maxScore, a.correct, a.wrong, a.durationSec, a.completed, a.createdAt]; }));
  else rows = [['studentId', 'realName', 'agentName', 'className', 'character', 'HUB', 'L1', 'L2', 'L3', 'FINAL', 'points', 'missionsCompleted', 'lastActive']]
    .concat(D.students.map(function (s) { var pts = 0, ms = 0; var best = ['HUB', 'L1', 'L2', 'L3', 'FINAL'].map(function (k) { var A = D.attempts.filter(function (a) { return a.studentId === s.studentId && a.activity === k; });
      if (!A.length) return ''; var b = Math.max.apply(null, A.map(function (a) { return a.score; })); pts += b; if (k !== 'HUB' && A.some(function (a) { return a.completed; })) ms++; return b; });
      return [s.studentId, s.realName, s.agentName, s.className, s.character].concat(best).concat([pts, ms, s.lastActive]); }));
  var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = c == null ? '' : String(c); if (/^[=+\-@]/.test(c)) c = "'" + c; return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
  if (INTEL.sample) csv = '﻿# SAMPLE / TEST DATA - NOT REAL STUDENT RESULTS\n' + csv.slice(1);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'mission-intelligence-' + kind + (INTEL.sample ? '-SAMPLE' : '') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Fail CSV dimuat turun.', 'ok');
}

/* v2.1: tunggu storan sedia (localStorage → IndexedDB → memori) sebelum memuatkan keadaan */
function showStorageWarning() {
  var w = $('#storageWarn'); if (!w) return;
  if (Store.persistent()) { w.classList.add('hidden'); return; }
  var inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  w.innerHTML = '⚠ <b>Pelayar ini tidak membenarkan laman menyimpan data dalam peranti.</b> Anda masih boleh belajar dan bermain, tetapi tetapan, log masuk dan keputusan yang <b>belum dihantar</b> akan hilang apabila halaman ditutup atau dimuat semula. ' +
    'Pastikan status keputusan bertanda <b>✓ Disemak & disimpan</b> sebelum menutup halaman.' +
    (inFrame ? '<div class="row"><a class="btn sm gold" href="' + esc(location.href.split('#')[0]) + '" target="_blank" rel="noopener">Buka dalam skrin penuh</a><span class="small muted">Membuka laman di luar Google Sites biasanya membolehkan storan.</span></div>' : '');
  w.classList.remove('hidden');
}
Store.init().then(function () { loadState(); boot(); showStorageWarning(); Store.onFail(showStorageWarning); });

function boot() {
  $('#brandLogo').innerHTML = logoSVG(40); $('#icHome').innerHTML = ICON.home; $('#icMC').innerHTML = ICON.grid;
  $('#icBack').innerHTML = ICON.back; $('#icNext').innerHTML = ICON.next;
  // navigasi dalaman: semua elemen [data-go]
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g && g.dataset.go && !g.disabled) { e.preventDefault(); Audio2.sfx('click'); closeMC(); go(g.dataset.go); return; }
  });
  $('#btnHome').addEventListener('click', function () { Audio2.sfx('click'); STATE.choosing = false; go('home'); });
  $('#brandBtn').addEventListener('click', function () { Audio2.sfx('click'); go('home'); });
  $('#btnMC').addEventListener('click', function () { Audio2.sfx('click'); openMC(); });
  $('#mcClose').addEventListener('click', closeMC);
  $('#mcOverlay').addEventListener('click', function (e) { if (e.target.id === 'mcOverlay') closeMC(); });
  var panel = $('#audioPanel');
  $('#btnAudio').addEventListener('click', function (e) { e.stopPropagation(); panel.classList.toggle('hidden'); $('#btnAudio').setAttribute('aria-expanded', !panel.classList.contains('hidden')); });
  document.addEventListener('click', function (e) { if (!panel.classList.contains('hidden') && !e.target.closest('#audioPanel') && !e.target.closest('#btnAudio')) panel.classList.add('hidden'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { panel.classList.add('hidden'); closeMC(); } });
  $('#audioResume').addEventListener('click', function () { Audio2.resume(); });
  var rm = Store.get('reduceMotion', false); document.body.classList.toggle('reduce-motion', rm); $('#auMotion').checked = rm;
  $('#auMotion').addEventListener('change', function (e) { Store.set('reduceMotion', e.target.checked); document.body.classList.toggle('reduce-motion', e.target.checked); });
  Audio2.bindPanel();
  buildMissionControl();
  window.addEventListener('hashchange', render);
  if (!location.hash) history.replaceState(null, '', '#/home');
  render();
  updateSyncPill();
  if (serverMode()) API.flush();
  window.addEventListener('offline', function () { toast('Sambungan Internet terputus. Keputusan akan disimpan apabila talian pulih.', 'gold'); });
  // cangkuk ujian (tiada data rahsia)
  window.AHA = { STATE: STATE, PM: PM, WORD_BANK: WORD_BANK, L3: L3_QUESTIONS, L3A: L3_APPRECIATION, progress: progress, API: API, Audio: Audio2, go: go, checkWord: checkWord, Store: Store, ready: true };
}
