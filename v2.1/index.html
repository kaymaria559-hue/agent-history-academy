<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent History Academy — The History Rescue Protocol</title>
<meta name="description" content="Agent History Academy: laman pembelajaran Sejarah Tahun 6 — Kenali Perdana Menteri Kita.">
<meta name="theme-color" content="#0b1733">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 6l46 16v32c0 28-20 50-46 60C34 104 14 82 14 54V22z' fill='%230b1a3d' stroke='%2322d3ee' stroke-width='6'/%3E%3Ccircle cx='60' cy='54' r='20' fill='none' stroke='%23f5c542' stroke-width='6'/%3E%3C/svg%3E">
<style>
/* =========================================================
   AGENT HISTORY ACADEMY — Sistem Reka Bentuk
   ========================================================= */
:root{
  --navy-950:#071129; --navy-900:#0b1733; --navy-800:#102148; --navy-700:#16305f;
  --navy-600:#1e3d75; --card:#132a55; --card-2:#183463; --line:rgba(120,200,255,.22);
  --cyan:#22d3ee; --cyan-2:#67e8f9; --cyan-dim:rgba(34,211,238,.16);
  --gold:#f5c542; --gold-2:#ffd978; --gold-dim:rgba(245,197,66,.16);
  --purple:#8b7cf6; --teal:#2dd4bf; --white:#ffffff; --text:#eaf2ff; --muted:#a9bad8; --grey:#cfd8e6;
  --good:#0aac23; --bad:#dc3c3d; --warn:#fbb315;
  --s1:#338ced; --s2:#e76624; --s3:#00a888; /* siri carta: kelas */
  --radius:18px; --radius-sm:12px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans SC','Noto Sans Tamil',sans-serif;
  --topbar-h:64px; --botbar-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font-body); font-size:18px; line-height:1.6; color:var(--text);
  background:var(--navy-900);
  background-image:
    radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(139,124,246,.14), transparent 60%),
    linear-gradient(180deg,#0d1b3d 0%, #0b1733 55%, #091430 100%);
  background-attachment:fixed; overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:var(--cyan-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* ---------- latar grid hologram ---------- */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(103,232,249,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.06) 1px,transparent 1px);
  background-size:48px 48px; mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-orbs span{position:absolute;border-radius:50%;filter:blur(40px);opacity:.25;animation:float 18s ease-in-out infinite}
.bg-orbs span:nth-child(1){width:280px;height:280px;background:var(--cyan);left:8%;top:18%}
.bg-orbs span:nth-child(2){width:220px;height:220px;background:var(--purple);right:6%;top:52%;animation-delay:-6s}
.bg-orbs span:nth-child(3){width:180px;height:180px;background:var(--gold);left:46%;bottom:-60px;opacity:.12;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-24px)}}

/* ---------- bar atas ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:10px;
  padding:0 14px;background:rgba(9,20,46,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:4px}
.brand svg{width:40px;height:40px;flex:none}
.brand-txt{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;line-height:1.15;text-align:left;color:var(--cyan-2)}
.brand-txt b{display:block;color:var(--white);font-size:14px}
.page-title{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;
  color:var(--gold-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;
  border-radius:12px;border:1px solid var(--line);background:rgba(34,211,238,.08);color:var(--text);cursor:pointer;
  font-weight:700;font-size:15px;transition:background .2s,transform .1s}
.icon-btn:hover{background:rgba(34,211,238,.18)}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .lbl{display:inline}
.sync-pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync-pill.ok{color:#8ff0a4;border-color:rgba(10,172,35,.5)}
.sync-pill.wait{color:var(--gold-2);border-color:rgba(245,197,66,.5)}
.sync-pill.off{color:var(--muted)}

/* ---------- panel audio ---------- */
.audio-panel{position:fixed;top:calc(var(--topbar-h) + 8px);right:12px;z-index:80;width:min(330px,calc(100vw - 24px));
  background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.audio-panel h3{margin:0 0 8px;font-family:var(--font-display);font-size:14px;letter-spacing:.08em;color:var(--cyan-2)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);gap:8px}
.switch{position:relative;width:56px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch span{position:absolute;inset:0;border-radius:99px;background:#33456b;transition:.2s}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--cyan)}
.switch input:checked+span::after{transform:translateX(26px)}
.switch input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--cyan)}
.audio-status{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- kandungan ---------- */
main{position:relative;z-index:1;min-height:calc(100vh - var(--topbar-h) - var(--botbar-h));padding:20px 16px 28px}
.view{max-width:1120px;margin:0 auto;animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.view.leaving{animation:viewOut .2s ease both}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}
h1,h2,h3{line-height:1.25}
h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,44px);letter-spacing:.04em;margin:.2em 0}
h2{font-family:var(--font-display);font-size:clamp(20px,3vw,28px);letter-spacing:.03em;color:var(--cyan-2);margin:1.2em 0 .5em}
h3{font-size:21px;margin:.6em 0 .3em;color:var(--white)}
p{margin:.5em 0}
.lead{font-size:20px;color:var(--grey)}
.kicker{font-family:var(--font-display);font-size:12px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.gold{color:var(--gold)} .cyan{color:var(--cyan-2)} .muted{color:var(--muted)}
.small{font-size:15px}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.page-no{font-family:var(--font-display);font-size:13px;letter-spacing:.14em;background:var(--gold-dim);color:var(--gold-2);
  border:1px solid rgba(245,197,66,.4);padding:4px 10px;border-radius:999px}

.card{background:linear-gradient(180deg,rgba(28,58,110,.85),rgba(19,42,85,.9));border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);position:relative}
.card.glow{box-shadow:0 0 0 1px rgba(34,211,238,.25),0 0 30px rgba(34,211,238,.12),var(--shadow)}
.card.goldline{border-color:rgba(245,197,66,.5)}
.card h3:first-child{margin-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.spacer{flex:1}

/* ---------- butang ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;
  border:1px solid rgba(103,232,249,.5);background:linear-gradient(180deg,#1f5f9a,#174a7c);color:#fff;font-weight:800;
  cursor:pointer;text-decoration:none;font-size:17px;transition:transform .1s,box-shadow .2s,background .2s;letter-spacing:.01em}
.btn:hover{box-shadow:0 0 18px rgba(34,211,238,.35)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.primary{background:linear-gradient(180deg,#22d3ee,#0ea5c6);color:#05213a;border-color:#a5f3fc}
.btn.gold{background:linear-gradient(180deg,#ffd978,#f5b400);color:#3a2600;border-color:#ffe9a8}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.danger{background:linear-gradient(180deg,#e05555,#b93636);border-color:#f4a0a0}
.btn.big{min-height:60px;font-size:21px;padding:14px 30px;border-radius:18px;font-family:var(--font-display);letter-spacing:.08em}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;
  background:var(--cyan-dim);border:1px solid rgba(34,211,238,.35);color:var(--cyan-2)}
.chip.gold{background:var(--gold-dim);border-color:rgba(245,197,66,.45);color:var(--gold-2)}
.chip.purple{background:rgba(139,124,246,.16);border-color:rgba(139,124,246,.45);color:#cfc7ff}
.chip.grey{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--grey)}
.tag-bt{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;background:#1d6b4f;color:#d7ffe9;letter-spacing:.05em}
.tag-new{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;background:#6b3f9a;color:#f0e3ff;letter-spacing:.05em}

/* ---------- bar bawah ---------- */
.botbar{position:sticky;bottom:0;z-index:40;height:var(--botbar-h);display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(9,20,46,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.botbar .crumb{flex:1;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Mission Control (menu) ---------- */
.mc-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,10,26,.82);backdrop-filter:blur(6px);display:flex;
  align-items:flex-start;justify-content:center;padding:70px 16px 16px;overflow:auto}
.mc-panel{width:min(980px,100%);background:var(--navy-800);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);
  animation:viewIn .3s ease both}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.mc-tile{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);
  background:rgba(34,211,238,.06);cursor:pointer;transition:.2s;min-height:76px}
.mc-tile:hover,.mc-tile.active{background:rgba(34,211,238,.16);border-color:var(--cyan)}
.mc-tile .no{font-family:var(--font-display);font-size:20px;color:var(--gold);min-width:34px}
.mc-tile b{display:block;font-size:16px}
.mc-tile small{display:block;color:var(--muted);font-size:13px;line-height:1.3}

/* ---------- PEMBUKAAN ---------- */
.intro{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#173a78 0%,#0a1633 55%,#050c1f 100%);overflow:hidden}
.intro .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 18px var(--cyan);animation:scan 3.2s linear infinite;opacity:.7}
@keyframes scan{from{top:-5%}to{top:105%}}
.intro .rings{position:absolute;width:min(90vw,640px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(34,211,238,.25);
  animation:spin 30s linear infinite}
.intro .rings::before,.intro .rings::after{content:'';position:absolute;inset:12%;border-radius:50%;border:1px dashed rgba(245,197,66,.25)}
.intro .rings::after{inset:26%;border:2px solid rgba(34,211,238,.18);border-left-color:transparent;border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.intro-logo{width:min(46vw,200px);position:relative;animation:logoIn 1.2s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
.intro h1{position:relative;margin:14px 0 2px;text-shadow:0 0 24px rgba(34,211,238,.5);animation:fadeUp .8s .5s both}
.intro .tagline{position:relative;font-family:var(--font-display);color:var(--gold-2);letter-spacing:.08em;font-size:clamp(13px,2.2vw,17px);animation:fadeUp .8s .8s both}
.intro .type{position:relative;min-height:2.6em;font-size:clamp(18px,3vw,24px);font-weight:800;margin:18px auto 6px;max-width:760px}
.intro .greet{position:relative;min-height:3.2em;font-size:clamp(17px,2.6vw,22px);color:var(--cyan-2);max-width:760px;transition:opacity .5s}
.intro .greet small{display:block;font-size:12px;letter-spacing:.2em;color:var(--muted);font-family:var(--font-display)}
.intro .actions{position:relative;margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s 1.2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:3px;height:1em;background:var(--cyan);vertical-align:-3px;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- pemilihan watak ---------- */
.char-stage{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;margin:20px 0}
.char-slot{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:8px 4px 12px;border-radius:20px}
.char-slot .fig{width:100%;max-width:190px;transition:transform .3s;position:relative;z-index:2}
.char-slot .circle{position:absolute;bottom:58px;left:50%;width:84%;max-width:200px;aspect-ratio:3/1;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(34,211,238,.25),rgba(34,211,238,.05) 60%,transparent 70%);
  border:2px solid rgba(34,211,238,.35);box-shadow:0 0 0 rgba(34,211,238,0);transition:.35s;z-index:1}
.char-slot:hover .circle{border-color:var(--cyan)}
.char-slot.sel .circle{border-color:var(--gold);background:radial-gradient(ellipse at center,rgba(245,197,66,.55),rgba(34,211,238,.25) 55%,transparent 72%);
  box-shadow:0 0 30px rgba(245,197,66,.6),0 0 60px rgba(34,211,238,.35)}
.char-slot.sel .fig{animation:hop .8s ease}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-3deg)}55%{transform:translateY(0)}70%{transform:translateY(-8px)}100%{transform:none}}
.char-slot .nm{margin-top:10px;font-family:var(--font-display);font-size:15px;letter-spacing:.08em}
.char-slot .tr{font-size:13px;color:var(--muted)}
.char-intro{min-height:90px}
.char-mini{width:64px;height:80px;flex:none}

/* ---------- landing ---------- */
.hero{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;align-items:center}
.hero .who{display:flex;flex-direction:column;align-items:center}
.hero .who .fig{width:min(240px,60vw);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.holo-plate{width:220px;height:40px;border-radius:50%;margin-top:-26px;background:radial-gradient(ellipse,rgba(34,211,238,.5),transparent 70%);filter:blur(1px)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.quick button{min-height:92px;flex-direction:column;font-size:15px;text-align:center}
.quick svg{width:28px;height:28px}

/* ---------- langkah (About) ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.steps button{flex:1;min-width:44px;height:10px;border-radius:99px;border:0;background:#2b4373;cursor:pointer;padding:0}
.steps button.on{background:var(--cyan)} .steps button.done{background:var(--teal)}
.dev-card{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dev-photo{width:130px;height:160px;border-radius:14px;object-fit:cover;border:2px solid var(--gold);background:#22385f;flex:none}
.ph-box{width:130px;height:160px;border-radius:14px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:12px;color:var(--muted);padding:8px;flex:none}

/* ---------- jadual ---------- */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:rgba(34,211,238,.1);color:var(--cyan-2);font-size:14px;letter-spacing:.03em;position:sticky;top:0}
tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.assure{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.assure .card{padding:16px}
.assure .L{font-family:var(--font-display);font-size:34px;color:var(--gold);line-height:1}

/* ---------- tab ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tabs button{border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-weight:700;min-height:44px}
.tabs button[aria-selected=true]{background:var(--cyan);color:#05213a;border-color:var(--cyan)}

/* ---------- komik ---------- */
.comic{max-width:860px;margin:0 auto}
.panel{position:relative;background:#f7f3e8;color:#1b2440;border-radius:16px;border:5px solid #0c1837;overflow:hidden;
  box-shadow:0 8px 0 #050b1d,var(--shadow);animation:panelIn .5s ease both}
@keyframes panelIn{from{opacity:0;transform:rotate(-1deg) scale(.97)}to{opacity:1;transform:none}}
.panel svg.scene{width:100%;height:auto;display:block}
.panel .cap{background:#ffd34d;color:#2a1d00;font-weight:800;padding:8px 14px;font-size:16px;border-bottom:4px solid #0c1837;letter-spacing:.02em}
.panel .txt{padding:12px 16px 14px;font-size:18px;background:#fff}
.bubble{position:absolute;background:#fff;color:#14203f;border:3px solid #0c1837;border-radius:18px;padding:8px 12px;font-size:15px;
  line-height:1.35;font-weight:700;max-width:46%;box-shadow:3px 3px 0 #0c1837}
.bubble::after{content:'';position:absolute;bottom:-14px;left:26px;border:8px solid transparent;border-top:10px solid #0c1837}
.bubble.r::after{left:auto;right:26px}
.comic-nav{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#2b4373;display:block}
.dots i.on{background:var(--gold)}

/* ---------- sketchnote ---------- */
.sketch{background:#fffdf6;color:#1d2542;border-radius:18px;padding:22px;font-family:'Comic Sans MS','Chalkboard SE','Nunito',sans-serif;
  background-image:linear-gradient(rgba(30,61,117,.07) 1px,transparent 1px);background-size:100% 32px;border:3px solid #1d2542}
.sketch h3{color:#c2410c;font-size:26px;text-align:center;margin:0 0 6px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.sk{border:2.5px dashed #1d2542;border-radius:16px;padding:10px 12px;position:relative;background:rgba(255,255,255,.7)}
.sk .n{position:absolute;top:-14px;left:-10px;width:34px;height:34px;border-radius:50%;background:#f5c542;border:2.5px solid #1d2542;
  display:flex;align-items:center;justify-content:center;font-weight:900}
.sk b{color:#0b4f8a}
.sk .cue{display:inline-block;margin-top:4px;background:#ffe7a3;padding:1px 8px;border-radius:8px;font-size:14px}
.sk-photo{width:54px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #1d2542;float:right;margin-left:8px}

/* ---------- video ---------- */
.video-box{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#000}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-facade{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  background:radial-gradient(circle,#1b3f7c,#071129);border:0;color:#fff;width:100%}
.video-facade .play{width:84px;height:84px;border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(220,60,61,.5)}

/* ---------- infografik / cetak ---------- */
.sheet{background:#fff;color:#14203f;width:100%;max-width:794px;margin:0 auto;aspect-ratio:210/297;padding:34px 36px;border-radius:6px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-body)}
.sheet .sh-head{border-bottom:6px solid #1e3d75;padding-bottom:8px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.sheet .sh-head h3{color:#1e3d75;font-size:32px;margin:0;font-family:var(--font-display);letter-spacing:.02em}
.sheet .sh-head .no{background:#f5b400;color:#2a1d00;font-weight:900;border-radius:10px;padding:4px 10px;font-size:15px}
.sheet .sh-foot{margin-top:auto;font-size:11px;color:#5a6788;border-top:2px solid #d6dff0;padding-top:6px;display:flex;justify-content:space-between;gap:8px}
.sheet .pm9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .pmc{border:2px solid #1e3d75;border-radius:12px;padding:10px 6px;text-align:center;font-size:16px;line-height:1.25;font-weight:700}
.sheet .pmc img{width:96px;height:116px;object-fit:cover;margin:0 auto 4px;border-radius:8px}
.sheet .pmc .k{display:inline-block;background:#1e3d75;color:#fff;border-radius:99px;font-weight:900;font-size:12px;padding:0 8px;margin-bottom:2px}
.sheet .lead2{font-size:20px;color:#14203f;margin:0 0 16px;line-height:1.45}
.sheet .gelar{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sheet .gl{border-left:8px solid #f5b400;background:#f3f6fc;border-radius:10px;padding:14px 14px;font-size:16px;line-height:1.45}
.sheet .gl b{font-size:19px;color:#1e3d75;display:block}
.sheet .tl{position:relative;padding-left:48px;margin-top:10px}
.sheet .tl::before{content:'';position:absolute;left:16px;top:4px;bottom:4px;width:5px;background:#1e3d75;border-radius:4px}
.sheet .tl-i{position:relative;margin-bottom:30px;font-size:19px;line-height:1.3}
.sheet .tl-i::before{content:attr(data-n);position:absolute;left:-44px;top:-4px;width:36px;height:36px;border-radius:50%;background:#f5b400;
  color:#2a1d00;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #1e3d75;font-size:13px}
.sheet .tl-i b{color:#1e3d75}
.sheet .sh-tip{background:#fff6d6;border:2px dashed #f5b400;border-radius:12px;padding:12px 16px;font-size:18px;margin-top:20px}

/* ---------- aktiviti / kuiz ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.opt{text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:17px;
  font-weight:700;min-height:56px;transition:.15s}
.opt:hover{border-color:var(--cyan);background:rgba(34,211,238,.1)}
.opt.right{border-color:var(--good);background:rgba(10,172,35,.22)}
.opt.wrong{border-color:var(--bad);background:rgba(220,60,61,.2)}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700}
.feedback.ok{background:rgba(10,172,35,.18);border:1px solid rgba(10,172,35,.6)}
.feedback.no{background:rgba(220,60,61,.16);border:1px solid rgba(220,60,61,.6)}
.feedback.info{background:rgba(34,211,238,.1);border:1px solid var(--line)}
.photo-q{width:150px;height:180px;object-fit:cover;border-radius:14px;border:3px solid var(--cyan);margin:6px auto}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match-col{display:flex;flex-direction:column;gap:10px}
.m-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.05);
  cursor:pointer;text-align:left;min-height:64px;font-weight:700;font-size:16px}
.m-item img{width:48px;height:58px;object-fit:cover;border-radius:8px;flex:none}
.m-item.pick{border-color:var(--gold);box-shadow:0 0 14px rgba(245,197,66,.4)}
.m-item.done{border-color:var(--good);background:rgba(10,172,35,.18);cursor:default}
.m-item.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Arkib: pilih level ---------- */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.lvl{position:relative;overflow:hidden;cursor:pointer;text-align:left;transition:transform .2s;min-height:240px;display:flex;flex-direction:column}
.lvl:hover{transform:translateY(-4px)}
.lvl .num{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--cyan);opacity:.9}
.lvl.locked{filter:grayscale(.85);opacity:.7;cursor:not-allowed}
.lvl.locked:hover{transform:none}
.lvl .state{margin-top:auto;padding-top:10px}
.lock-ico{position:absolute;right:16px;top:16px;width:34px;height:34px}
.story-box{border-left:5px solid var(--gold);padding:12px 16px;background:rgba(245,197,66,.08);border-radius:0 14px 14px 0;font-size:19px}

/* ---------- HUD permainan ---------- */
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(5,14,36,.6);border:1px solid var(--line);margin-bottom:14px}
.hud .item{display:flex;align-items:center;gap:6px;font-weight:800}
.hearts{display:flex;gap:4px}
.hearts svg{width:26px;height:26px}
.bar{height:16px;border-radius:99px;background:#22375f;overflow:hidden;min-width:120px;flex:1;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .5s}
.bar.boss i{background:linear-gradient(90deg,#b05cf6,#ff6b9a)}
.rooms{display:flex;gap:8px;flex-wrap:wrap}
.room-pill{padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700}
.room-pill.on{background:var(--cyan);color:#05213a}
.room-pill.done{background:rgba(10,172,35,.3);border-color:var(--good)}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 14px;max-width:460px}
.frame{aspect-ratio:4/5;border-radius:12px;border:3px solid #3b5584;background:#0b1a3a;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) blur(6px) brightness(.5);transition:filter .8s}
.frame.open{border-color:var(--gold);box-shadow:0 0 18px rgba(245,197,66,.4)}
.frame.open img{filter:none}
.frame .lk{position:absolute;font-size:30px}
.frame .lbl{position:absolute;bottom:0;left:0;right:0;font-size:12px;font-weight:800;background:rgba(5,14,36,.8);padding:3px 4px;text-align:center}

/* timeline sortable */
.tl-list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.tl-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:linear-gradient(180deg,#1b3a6d,#15305c);
  touch-action:none;user-select:none;cursor:grab;transition:border-color .2s,background .2s}
.tl-card.drag{opacity:.85;box-shadow:0 10px 30px rgba(0,0,0,.5);border-color:var(--gold);cursor:grabbing;position:relative;z-index:5}
.tl-card.ok{border-color:var(--good)} .tl-card.no{border-color:var(--bad)}
.tl-card img{width:44px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.tl-card .pos{font-family:var(--font-display);color:var(--gold);width:28px;text-align:center;flex:none}
.tl-card .t{flex:1;font-weight:800;font-size:16px;line-height:1.3}
.tl-card .mv{display:flex;gap:4px}
.tl-card .mv button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer}
.grip{width:18px;opacity:.6;flex:none}
.enemy{width:96px;height:96px;flex:none}
.zap{animation:zap .6s}
@keyframes zap{0%,100%{filter:none}20%{filter:hue-rotate(90deg) brightness(1.6)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.glitch{animation:glitch .5s steps(2) 2}
@keyframes glitch{0%{clip-path:inset(0 0 60% 0);transform:translate(-4px)}50%{clip-path:inset(40% 0 0 0);transform:translate(4px)}100%{clip-path:none;transform:none}}

/* galeri L3 */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-bottom:14px}
.gal{aspect-ratio:3/4;border-radius:10px;border:3px solid #47597c;position:relative;overflow:hidden;background:#0e1b38}
.gal img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(.6) brightness(.45);transition:filter 1s}
.gal::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.07) 10px 12px)}
.gal.fixed{border-color:var(--gold)}
.gal.fixed img{filter:none}
.gal.fixed::after{display:none}
.frag{display:inline-flex;width:26px;height:26px}

/* ---------- Final: Word Strike ---------- */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px}
.fighter .fig{width:min(150px,28vw)}
.boss-fig{width:min(170px,30vw)}
.vs{font-family:var(--font-display);font-size:28px;color:var(--gold)}
.q-box{font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:16px;background:rgba(5,14,36,.6);border:1px solid var(--line);min-height:84px}
.answer{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:60px;padding:10px;border-radius:14px;border:2px dashed rgba(103,232,249,.5);margin:12px 0}
.answer .tile{width:44px;height:52px;font-size:24px}
.answer .tile.sel{outline:3px solid var(--gold)}
.answer .empty{color:var(--muted);align-self:center;font-size:15px}
.letters{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:620px;margin:0 auto}
.tile{display:flex;align-items:center;justify-content:center;height:50px;border-radius:10px;border:2px solid #a5f3fc;font-family:var(--font-display);
  font-weight:900;font-size:22px;background:linear-gradient(180deg,#e9fbff,#b9eefb);color:#06304a;cursor:pointer;box-shadow:0 4px 0 #2a7c99;transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #2a7c99}
.tile.space{grid-column:span 2;font-size:13px}
.beam{position:absolute;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--cyan),#fff,var(--gold));box-shadow:0 0 20px var(--cyan);
  pointer-events:none;z-index:20;transform-origin:left center;animation:beam .6s ease-out forwards}
@keyframes beam{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.shield{animation:shield .7s}
@keyframes shield{0%,100%{filter:none}50%{filter:drop-shadow(0 0 22px #67e8f9) brightness(1.3)}}
.burst{animation:burst .7s}
@keyframes burst{0%{filter:none}30%{filter:brightness(2) drop-shadow(0 0 30px #ffd978);transform:scale(.92)}100%{filter:none;transform:none}}

/* ---------- borang ---------- */
label.f{display:block;font-weight:800;margin:12px 0 6px}
.input,select.input,textarea.input{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(5,14,36,.6);font-size:18px}
.input:focus{border-color:var(--cyan);outline:none}
.err{color:#ffb4b4;font-size:15px;font-weight:700;min-height:1.2em;margin-top:4px}
.code-box{font-family:var(--font-display);font-size:26px;letter-spacing:.12em;color:var(--gold-2);background:rgba(5,14,36,.7);border:2px dashed var(--gold);
  border-radius:14px;padding:10px 16px;text-align:center;user-select:all}
.badge-row{display:flex;gap:12px;flex-wrap:wrap}
.badge{width:96px;text-align:center;font-size:13px;font-weight:800;line-height:1.2}
.badge svg{width:76px;height:76px;margin:0 auto 4px;display:block}
.badge.off{opacity:.3;filter:grayscale(1)}
.likert{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
.likert label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);cursor:pointer;
  text-align:center;font-size:13px;font-weight:700;line-height:1.2;min-height:64px;justify-content:center}
.likert input{position:absolute;opacity:0;pointer-events:none}
.likert label:has(input:checked){border-color:var(--gold);background:rgba(245,197,66,.16)}
.likert label:has(input:focus-visible){outline:3px solid var(--gold)}
.likert .em{font-size:22px}
.fb-q{padding:12px 0;border-bottom:1px dashed var(--line)}

/* ---------- carta ---------- */
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.chart .v{fill:var(--text);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stat{padding:16px}
.stat .k{font-size:14px;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--font-display);font-size:30px;color:var(--white);line-height:1.2}
.stat .s{font-size:13px;color:var(--muted)}
.empty-state{text-align:center;padding:30px 16px;border:2px dashed var(--line);border-radius:16px;color:var(--grey)}
.sample-banner{background:repeating-linear-gradient(45deg,#7a5a00,#7a5a00 14px,#5c4300 14px,#5c4300 28px);color:#fff;font-weight:900;text-align:center;
  padding:10px;border-radius:12px;letter-spacing:.05em;margin-bottom:12px}
.tip{position:fixed;z-index:200;pointer-events:none;background:#0a1633;border:1px solid var(--cyan);border-radius:10px;padding:6px 10px;font-size:14px;max-width:240px;box-shadow:var(--shadow)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0 16px}
.filters>div{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.filters label{font-size:13px;font-weight:800;color:var(--muted)}
.filters .input{min-height:42px;font-size:16px;padding:6px 10px}

/* ---------- toast / modal ---------- */
.toasts{position:fixed;left:50%;bottom:calc(var(--botbar-h) + 12px);transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;
  width:min(520px,calc(100vw - 32px))}
.toast{padding:12px 16px;border-radius:14px;background:#0f2550;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;animation:viewIn .3s ease both}
.toast.ok{border-color:var(--good)} .toast.bad{border-color:var(--bad)} .toast.gold{border-color:var(--gold)}
.modal-back{position:fixed;inset:0;z-index:160;background:rgba(3,8,22,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--navy-800);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);animation:viewIn .3s both}
.victory{text-align:center}
.victory h2{font-size:clamp(26px,5vw,40px);color:var(--gold)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:170;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.save-state{font-size:15px;font-weight:800;padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:inline-block}
.save-state.ok{color:#8ff0a4;border-color:var(--good)}
.save-state.wait{color:var(--gold-2)}
.save-state.bad{color:#ffb4b4;border-color:var(--bad)}
.notice{padding:12px 14px;border-radius:14px;border:1px solid rgba(245,197,66,.5);background:rgba(245,197,66,.08);font-size:16px}

/* ---------- responsif ---------- */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero .who{order:-1}
  .brand-txt{display:none}
  .icon-btn .lbl{display:none}
  .letters{grid-template-columns:repeat(7,1fr)}
  .sync-pill{display:none}
}
@media (max-width:560px){
  body{font-size:17px}
  main{padding:14px 12px 24px}
  .char-stage{gap:6px}
  .char-slot .nm{font-size:12px}
  .char-slot .tr{font-size:11px}
  .match{grid-template-columns:1fr}
  .frames{gap:6px}
  .page-title{font-size:12px}
  .bubble{font-size:12px;padding:5px 8px;max-width:52%}
  .panel .txt{font-size:16px}
  .letters{grid-template-columns:repeat(6,1fr)}
  .tile{height:46px;font-size:20px}
  .answer .tile{width:36px;height:44px;font-size:20px}
  .sheet{padding:16px;aspect-ratio:auto}
  .sheet .pm9{grid-template-columns:repeat(2,1fr)}
  .sheet .gelar{grid-template-columns:1fr}
  .likert label{font-size:11px}
  .botbar .crumb{visibility:hidden}
  .hud .item{flex-wrap:wrap}
  .arena{grid-template-columns:1fr auto 1fr}
  .btn.big{font-size:17px;padding:12px 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ---------- CETAK ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important;height:auto}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{width:210mm;height:296mm;max-width:none;margin:0;box-shadow:none;border-radius:0;aspect-ratio:auto;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;padding:14mm 14mm 10mm;page-break-after:avoid}
  #printRoot .pm9{grid-template-columns:repeat(3,1fr)}
  #printRoot .gelar{grid-template-columns:repeat(2,1fr)}
}

/* v2.1 — amaran storan pelayar disekat */
.storage-warn{max-width:1180px;margin:10px auto 0;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,93,122,.6);background:rgba(255,93,122,.12);font-size:15px;line-height:1.45}
.storage-warn.hidden{display:none}
.storage-warn .row{gap:8px;margin-top:6px}
@media (max-width:560px){.storage-warn{margin:8px 10px 0;font-size:14px}}
details.privacy summary::-webkit-details-marker{color:var(--gold)}
/* v2.1 — betulkan skrol mendatar pada telefon (Level 2 & References) */
.l2-grid{grid-template-columns:1fr auto;align-items:start}
.view a{overflow-wrap:anywhere}
@media (max-width:560px){.l2-grid{grid-template-columns:1fr}.l2-grid>div:last-child svg{max-width:120px;height:auto}}

</style>
</head>
<body>
<a href="#view" class="sr-only">Langkau ke kandungan</a>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="topbar">
  <button class="brand" id="brandBtn" aria-label="Agent History Academy — ke laman utama"><span id="brandLogo"></span><span class="brand-txt"><b>AGENT HISTORY</b>ACADEMY</span></button>
  <div class="page-title" id="pageTitle" aria-live="polite"></div>
  <div class="top-actions">
    <span class="sync-pill" id="syncPill" role="status"></span>
    <button class="icon-btn" id="btnHome" aria-label="Home"><span id="icHome"></span><span class="lbl">Home</span></button>
    <button class="icon-btn" id="btnMC" aria-label="Mission Control: semua bahagian"><span id="icMC"></span><span class="lbl">Mission Control</span></button>
    <button class="icon-btn" id="btnAudio" aria-haspopup="true" aria-expanded="false" aria-controls="audioPanel"></button>
  </div>

var STATE = {

  local: { best: {}, completed: {}, history: [] },   // mod tempatan / tetamu sahaja

function loadState() {
  STATE.character = Store.get('character', null);
  STATE.hijab = Store.get('hijab', true);
  STATE.session = Store.get('session', null);
  STATE.profile = Store.get('profile', null);
  STATE.local = Store.get('localProgress', { best: {}, completed: {}, history: [] });
}
function serverMode() { return !!(CONFIG.API_URL && STATE.session && STATE.session.mode === 'server'); }

/* Kemajuan berkesan.
   Mod pelayan: profil yang DISAHKAN pelayan + keputusan yang masih menunggu
   dalam peti keluar (dipaparkan sebagai "belum disimpan"). Keputusan yang
   ditolak pelayan dibuang, jadi level tidak kekal terbuka secara palsu.
   Mod tempatan / tetamu: rekod dalam peranti ini sahaja. */
function progress() {
  var best = {}, completed = {};
  function add(act, score, done) { if (!(act in best) || score > best[act]) best[act] = score; if (done) completed[act] = true; }
  if (serverMode()) {
    var p = STATE.profile;
    if (p && p.best) Object.keys(p.best).forEach(function (k) { add(k, p.best[k], false); });
    if (p && p.completed) p.completed.forEach(function (k) { completed[k] = true; });
    (Store.get('outbox', []) || []).forEach(function (o) { if (o.studentId === STATE.session.studentId) add(o.activity, o.claim ? o.claim.score : 0, o.claim && o.claim.completed); });
  } else {
    var L = STATE.local;
    Object.keys(L.best || {}).forEach(function (k) { add(k, L.best[k], false); });
    Object.keys(L.completed || {}).forEach(function (k) { if (L.completed[k]) completed[k] = true; });
  }
  var points = 0; Object.keys(best).forEach(function (k) { points += best[k]; });
  return { best: best, completed: completed, points: points };
}
function isUnlocked(act) {
  var c = progress().completed;
  if (act === 'L1') return true;
  if (act === 'L2') return !!c.L1;
  if (act === 'L3') return !!c.L1 && !!c.L2;
  if (act === 'FINAL') return !!c.L1 && !!c.L2 && !!c.L3;
  return true;
}

      tone(t, NOTE(deg(T, d, 1)), spb * aEvery * .8, T.arp, T.arp === 'saw' ? .035 : .05, musicBus, { rel: .1, cut: T.arp === 'saw' ? 1400 : 3000 });
    }
    // melodi ringkas (motif berulang setiap 2 bar, lembut)
    if (T.lead && (bar % 4 === 1 || bar % 4 === 3) && [0, 6, 10].indexOf(s16) >= 0) {
      var m = [tri[2] + 1, tri[1] + 2, tri[2]][[0, 6, 10].indexOf(s16)];
      tone(t, NOTE(deg(T, m, 1)), spb * 3, 'tri', .05 * T.lead, musicBus, { atk: .02, rel: .2, cut: 2600 });
    }
    // loceng
    if (T.bell && s16 === 8 && bar % 2 === 0) tone(t, NOTE(deg(T, tri[2] + 7, 1)), spb * 8, 'sine', .04 * T.bell, musicBus, { atk: .005, rel: .8 });
    // dram ringan
    if (T.kick && s16 % 4 === 0 && (T.kick >= .8 || s16 % 8 === 0)) kick(t, .22 * T.kick);
    if (T.hat && s16 % 2 === 0) noise(t, .04, (s16 % 4 === 2 ? .05 : .025) * T.hat, musicBus);
  }

  /* ---------------- tukar tema dengan fade ---------------- */
  function setTheme(name) {
    pendingTheme = name;
    if (!ctx || !prefs.on || !prefs.music) { theme = null; return; }
    if (theme === name) { applyLevels(); return; }            // tidak dimulakan semula
    var t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value, t);
    musicBus.gain.linearRampToValueAtTime(0, t + .6);          // fade keluar
    var target = name;
    setTimeout(function () {
      if (pendingTheme !== target) return;
      theme = target; startSeq();
      var t2 = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(t2); musicBus.gain.setValueAtTime(0, t2);
      musicBus.gain.linearRampToValueAtTime(.26 * duckLevel(), t2 + 1.2); // fade masuk
    }, theme ? 650 : 10);
  }

  /* ---------------- kesan bunyi ---------------- */
  var SFX = {
    click:   function (t) { tone(t, 880, .06, 'sine', .12, sfxBus, { atk: .002 }); },
    select:  function (t) { [72, 79, 84].forEach(function (m, i) { tone(t + i * .07, NOTE(m), .22, 'tri', .14, sfxBus); }); },
    activate:function (t) { tone(t, 220, .7, 'saw', .1, sfxBus, { slide: 880, cut: 2500, atk: .02 }); tone(t + .5, NOTE(88), .4, 'sine', .14, sfxBus); },
    success: function (t) { [72, 76, 79, 84].forEach(function (m, i) { tone(t + i * .08, NOTE(m), .25, 'tri', .15, sfxBus); }); },
    error:   function (t) { tone(t, 220, .18, 'sq', .07, sfxBus, { cut: 900 }); tone(t + .17, 174, .28, 'sq', .07, sfxBus, { cut: 800 }); },
    unlock:  function (t) { [79, 83, 86, 91, 95].forEach(function (m, i) { tone(t + i * .06, NOTE(m), .3, 'sine', .1, sfxBus); }); },
    attack:  function (t) { tone(t, 300, .35, 'saw', .1, sfxBus, { slide: 1500, cut: 3000 }); noise(t + .25, .3, .12, sfxBus, 2000); },
    shield:  function (t) { tone(t, 520, .4, 'sine', .12, sfxBus, { slide: 260 }); },
    victory: function (t) { [67, 72, 76, 79, 84, 88].forEach(function (m, i) { tone(t + i * .11, NOTE(m), .5, 'tri', .14, sfxBus); }); },
    zap:     function (t) { noise(t, .25, .14, sfxBus, 1200); tone(t, 160, .25, 'sq', .06, sfxBus, { slide: 80, cut: 700 }); }
  };
  function sfx(name) {
    if (!ctx || !prefs.on || !prefs.sfx || ctx.state !== 'running') return;
    try { SFX[name] && SFX[name](ctx.currentTime + .01); } catch (e) {}
  }

  /* ---------------- narasi (pilihan) ---------------- */
  function voice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ms/i.test(v.lang); })[0] || vs.filter(function (v) { return /^id/i.test(v.lang); })[0] || null;
  }
  function narrate(text) {
    if (!prefs.narrate || !prefs.on || !window.speechSynthesis) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); var v = voice(); if (v) u.voice = v; u.lang = v ? v.lang : 'ms-MY';
      u.rate = .95; u.volume = Math.min(1, prefs.volume + .2); duck('narrate', .35); u.onend = u.onerror = function () { unduck('narrate'); }; speechSynthesis.speak(u); } catch (e) {}
  }
  function stopNarrate() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} unduck('narrate'); }

  function duck(name, lvl) { ducks[name] = lvl; applyLevels(); }
  function unduck(name) { delete ducks[name]; applyLevels(); }

  /* ---------------- aktifkan (selepas interaksi) ---------------- */
  function enable(on) {
    if (on) { if (!ensure()) { toast('Pelayar ini tidak menyokong audio. Anda boleh terus belajar tanpa bunyi.'); return; }
      prefs.on = true; ctx.resume && ctx.resume(); }
    else prefs.on = false;
    prefs.asked = true; save(); applyLevels(); setTheme(pendingTheme);
    if (on) setTimeout(function () { if (ctx && ctx.state !== 'running') showResume(); }, 600);
  }
  function showResume() {
    var b = $('#audioResume'); if (b) b.classList.remove('hidden');
  }
  function resume() {
    if (!ensure()) return; ctx.resume().then(function () { var b = $('#audioResume'); if (b) b.classList.add('hidden'); setTheme(pendingTheme); applyLevels(); });
  }

  /* ---------------- antara muka panel ---------------- */
  function updateUI() {
    var b = $('#btnAudio'); if (!b) return;
    b.innerHTML = (prefs.on ? ICON.sound : ICON.mute) + '<span class="lbl">' + (prefs.on ? 'Bunyi' : 'Senyap') + '</span>';
    b.setAttribute('aria-label', prefs.on ? 'Tetapan audio (bunyi hidup)' : 'Tetapan audio (bunyi dimatikan)');
    var set = function (id, v) { var el = $(id); if (el) el.checked = v; };
    set('#auOn', prefs.on); set('#auMusic', prefs.music); set('#auSfx', prefs.sfx); set('#auNarr', prefs.narrate);
    var vol = $('#auVol'); if (vol) vol.value = Math.round(prefs.volume * 100);
    var st = $('#auStatus');
    if (st) st.textContent = !prefs.on ? 'Semua bunyi dimatikan. Semua aktiviti boleh dibuat tanpa bunyi.'
      : 'Muzik: ' + (prefs.music ? 'HIDUP' : 'MATI') + ' · Kesan bunyi: ' + (prefs.sfx ? 'HIDUP' : 'MATI') + ' · Kelantangan ' + Math.round(prefs.volume * 100) + '%';
  }
  function bindPanel() {
    prefs = Object.assign({}, DEF, Store.get('audio', DEF) || {});
    $('#auOn').addEventListener('change', function (e) { enable(e.target.checked); });
    $('#auMusic').addEventListener('change', function (e) { prefs.music = e.target.checked; save(); if (prefs.music) setTheme(pendingTheme); else { theme = null; applyLevels(); } });
    $('#auSfx').addEventListener('change', function (e) { prefs.sfx = e.target.checked; save(); applyLevels(); sfx('click'); });
    $('#auNarr').addEventListener('change', function (e) { prefs.narrate = e.target.checked; save(); if (!prefs.narrate) stopNarrate(); });
    $('#auVol').addEventListener('input', function (e) { prefs.volume = Number(e.target.value) / 100; save(); applyLevels(); });
    document.addEventListener('visibilitychange', function () {
      if (!ctx) return; if (document.hidden) ctx.suspend && ctx.suspend(); else if (prefs.on) ctx.resume && ctx.resume();
    });
    // jika murid pernah hidupkan bunyi: sambung pada klik pertama (tanpa mesej berulang)
    if (prefs.on) {
      var once = function () { document.removeEventListener('pointerdown', once, true); document.removeEventListener('keydown', once, true); if (ensure()) { ctx.resume(); applyLevels(true); setTheme(pendingTheme); } };
      document.addEventListener('pointerdown', once, true); document.addEventListener('keydown', once, true);
    }
    updateUI();
  }
  return { setTheme: setTheme, sfx: sfx, enable: enable, resume: resume, duck: duck, unduck: unduck, narrate: narrate,
           stopNarrate: stopNarrate, bindPanel: bindPanel, prefs: function () { return prefs; }, updateUI: updateUI,
           state: function () { return { ctx: ctx ? ctx.state : 'none', theme: theme, ducks: Object.assign({}, ducks), prefs: prefs }; } };
})();

     (startGame) dan merekod log jawapan (ID soalan + jawapan dipilih).
     Pelayan menilai log dan mengira betul, salah, markah dan status selesai.
   - Peti keluar (outbox) menyimpan keputusan yang belum disahkan pelayan
     dan menghantar semula dengan reqId yang SAMA (tiada rekod berganda).
   ===================================================================== */
var API = (function () {
  function configured() { return !!CONFIG.API_URL; }

  function call(action, data) {
    if (!configured()) return Promise.reject({ code: 'NO_API', message: 'Pangkalan data pusat belum disambung (CONFIG.API_URL kosong).' });
    if (!navigator.onLine) return Promise.reject({ code: 'NETWORK', message: 'Tiada sambungan Internet. Cuba lagi apabila talian pulih.' });
    var body = Object.assign({ action: action }, data || {});
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { ctrl && ctrl.abort(); }, CONFIG.API_TIMEOUT);
    return fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body),
                                   redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw { code: 'NETWORK', message: 'Pelayan tidak dapat dihubungi (' + r.status + ').' }; return r.json(); })
      .then(function (j) { clearTimeout(timer); if (!j || !j.ok) throw { code: (j && j.error) || 'SERVER', message: (j && j.message) || 'Ralat pelayan.' }; return j.data; })
      .catch(function (e) { clearTimeout(timer); if (e && e.code) throw e; throw { code: 'NETWORK', message: 'Sambungan gagal. Semak Internet dan cuba lagi.' }; });
  }
  function transient(e) { return e && (e.code === 'NETWORK' || e.code === 'BUSY' || e.code === 'SERVER' || e.code === 'RATE_LIMIT'); }

  /* ---------------- sesi pelajar ---------------- */
  function setSession(s, profile) {
    var prevSid = STATE.session && STATE.session.studentId;
    STATE.session = s; Store.set('session', s);
    if (profile) { STATE.profile = profile; Store.set('profile', profile); }
    if (s && prevSid && prevSid !== s.studentId) {           // pelajar lain di peranti sama
      STATE.local = { best: {}, completed: {}, history: [] }; Store.set('localProgress', STATE.local);
      Store.set('outbox', (Store.get('outbox', []) || []).filter(function (o) { return o.studentId === s.studentId; }));
    }
    Store.del('guestOutbox');                                 // v2.1: keputusan tetamu tidak dipindahkan (tidak dapat disahkan)
    updateSyncPill();
  }
  function logout() {
    STATE.session = null; STATE.profile = null; Store.del('session'); Store.del('profile');
    STATE.local = { best: {}, completed: {}, history: [] }; Store.set('localProgress', STATE.local);
    updateSyncPill();
  }

  /* ---------------- sesi permainan (v2.1) ----------------
     var G = API.game('L1');  G.add('P3', 3);  G.hint('S1');
     Dalam mod pelayan, gameId diminta semasa permainan bermula. Jika gagal
     (contoh: luar talian), gameId diminta semula semasa keputusan dihantar. */
  function game(activity) {
    var g = { activity: activity, gameId: null, log: [], t0: Date.now(), startP: Promise.resolve() };
    if (serverMode()) {
      g.startP = call('startGame', { token: STATE.session.token, activity: activity })
        .then(function (d) { g.gameId = d.gameId; }, function (e) {
          g.startErr = e;
          if (e.code === 'SESSION_EXPIRED') STATE.needLogin = true;
        });
    }
    g.add = function (q, a, extra) { var e = { q: q, a: a }; if (extra) Object.keys(extra).forEach(function (k) { e[k] = extra[k]; }); g.log.push(e); };
    g.hint = function (q, extra) { var e = { q: q, h: 1 }; if (extra) Object.keys(extra).forEach(function (k) { e[k] = extra[k]; }); g.log.push(e); };
    return g;
  }

  /* ---------------- rekod keputusan aktiviti ----------------
     r = paparan pelayar sahaja (markah anggaran). Yang disimpan ialah
     markah yang dikira semula oleh pelayan daripada g.log. */
  function record(activity, r, g) {
    var claim = { score: Math.max(0, Math.min(100, Math.round(r.score))), correct: r.correct | 0, wrong: r.wrong | 0, completed: !!r.completed };
    var dur = Math.max(0, Math.round(r.durationSec || 0));
    if (!serverMode()) {
      // mod tempatan / tetamu: kemajuan dalam peranti ini sahaja
      var L = STATE.local;
      if (!(activity in L.best) || claim.score > L.best[activity]) L.best[activity] = claim.score;
      if (claim.completed) L.completed[activity] = true;
      L.history.unshift({ activity: activity, score: claim.score, maxScore: 100, completed: claim.completed, durationSec: dur, createdAt: new Date().toISOString(), local: true });
      L.history = L.history.slice(0, 40); Store.set('localProgress', L);
      return Promise.resolve({ state: STATE.session ? 'local' : 'guest' });
    }
    if (!g || !g.log || !g.log.length) return Promise.resolve({ state: 'error', message: 'Tiada log jawapan untuk disahkan.' });
    return g.startP.then(function () {
      if (g.startErr && !transient(g.startErr) && g.startErr.code !== 'SESSION_EXPIRED') {
        return { state: 'error', message: g.startErr.message };
      }
      var item = { reqId: uid(), activity: activity, gameId: g.gameId, late: !g.gameId, log: g.log, durationSec: dur, claim: claim,
                   at: new Date().toISOString(), studentId: STATE.session.studentId };
      var ob = Store.get('outbox', []); ob.push(item); Store.set('outbox', ob); updateSyncPill();
      return flush().then(function () {
        var still = (Store.get('outbox', []) || []).some(function (o) { return o.reqId === item.reqId; });
        if (still) return { state: 'pending', reqId: item.reqId, claim: claim };
        if (rejected[item.reqId]) return { state: 'error', reqId: item.reqId, message: rejected[item.reqId] };
        return { state: 'saved', reqId: item.reqId, claim: claim, result: verified[item.reqId] };
      });
    });
  }

  var flushing = null, retryTimer = null, rejected = {}, verified = {};
  function flush() {
    if (flushing) return flushing;
    if (!serverMode()) return Promise.resolve();
    flushing = (function loop() {
      var ob = Store.get('outbox', []);
      var it = ob.filter(function (o) { return o.studentId === STATE.session.studentId; })[0];
      if (!it) return Promise.resolve();
      var ready = it.gameId ? Promise.resolve(it.gameId)
        : call('startGame', { token: STATE.session.token, activity: it.activity, late: true }).then(function (d) {
            it.gameId = d.gameId; patchItem(it.reqId, { gameId: d.gameId }); return d.gameId; });
      return ready.then(function (gameId) {
        return call('saveAttempt', { token: STATE.session.token, reqId: it.reqId, gameId: gameId, activity: it.activity, log: it.log, durationSec: it.durationSec });
      }).then(function (d) {
          removeItem(it.reqId);
          if (d && d.result) verified[it.reqId] = d.result;
          if (d && d.profile) { STATE.profile = d.profile; Store.set('profile', d.profile); }
          return loop();
        })
        .catch(function (e) {
          if (e.code === 'SESSION_EXPIRED') { STATE.needLogin = true; toast('Sesi tamat. Log masuk semula di Agent Identity untuk menyimpan keputusan.', 'gold', 6000); return; }
          if (transient(e)) { scheduleRetry(); return; }
          // ralat pengesahan: rekod tidak sah — buang & beritahu
          removeItem(it.reqId); rejected[it.reqId] = e.message; toast('Keputusan tidak diterima pelayan: ' + e.message, 'bad', 6000); return loop();
        });
    })().then(function () { flushing = null; updateSyncPill(); }, function () { flushing = null; updateSyncPill(); });
    return flushing;
  }
  function patchItem(reqId, patch) {
    Store.set('outbox', (Store.get('outbox', []) || []).map(function (o) { if (o.reqId === reqId) Object.keys(patch).forEach(function (k) { o[k] = patch[k]; }); return o; }));
  }
  function removeItem(reqId) { Store.set('outbox', (Store.get('outbox', []) || []).filter(function (o) { return o.reqId !== reqId; })); }
  function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(flush, 20000); }
  window.addEventListener('online', function () { flush(); });

  function refreshProfile() {
    if (!serverMode()) return Promise.resolve(STATE.profile);
    return call('profile', { token: STATE.session.token }).then(function (d) { STATE.profile = d.profile; Store.set('profile', d.profile); STATE.needLogin = false; return d.profile; })
      .catch(function (e) { if (e.code === 'SESSION_EXPIRED') STATE.needLogin = true; throw e; });
  }

  function statusOf(reqId) {
    if ((Store.get('outbox', []) || []).some(function (o) { return o.reqId === reqId; })) return { state: 'pending', reqId: reqId };
    if (rejected[reqId]) return { state: 'error', reqId: reqId, message: rejected[reqId] };
    return { state: 'saved', reqId: reqId, result: verified[reqId] };
  }
  return { configured: configured, call: call, game: game, record: record, flush: flush, setSession: setSession, logout: logout, refreshProfile: refreshProfile, statusOf: statusOf };
})();

/* Paparan status simpanan (tidak pernah "berjaya" sebelum pelayan sahkan) */
function saveStatusHTML(st) {
  if (!st) return '<span class="save-state wait">⏳ Menghantar ke pelayan untuk disemak…</span>';
  if (st.state === 'saved') {
    var r = st.result, diff = r && st.claim && (r.score !== st.claim.score || r.completed !== st.claim.completed);
    return '<span class="save-state ok">✓ Disemak & disimpan oleh pelayan' + (r ? ': markah disahkan <b>' + r.score + ' / 100</b>' + (r.completed ? '' : ' (belum selesai)') : '') + '</span>' +
      (diff ? '<div class="small muted" style="margin-top:4px">Markah rasmi ialah markah yang dikira oleh pelayan.</div>' : '');
  }
  if (st.state === 'pending') {
    return '<span class="save-state bad">⚠ Belum disimpan — sambungan gagal. ' +
      (Store.persistent() ? 'Keputusan disimpan sementara dalam peranti ini dan akan dihantar secara automatik.'
                          : '<b>Pelayar ini menyekat storan, jadi keputusan akan HILANG jika halaman ditutup atau dimuat semula.</b> Jangan tutup halaman ini sehingga status bertukar ✓.') +
      '</span> <button class="btn sm" data-retry>Cuba simpan semula</button>';
  }
  if (st.state === 'error') return '<span class="save-state bad">✗ Keputusan tidak diterima pelayan: ' + esc(st.message || '') + '</span>';
  if (st.state === 'guest') return '<span class="save-state wait">ℹ Anda belum log masuk, jadi keputusan ini <b>tidak direkodkan</b> dalam pangkalan data. <a href="#/identity">Daftar atau log masuk</a> sebelum bermain supaya keputusan disemak dan disimpan.</span>';
  return '<span class="save-state wait">ℹ Mod tempatan: keputusan disimpan dalam peranti ini sahaja (pangkalan data pusat belum disambung).' +
    (Store.persistent() ? '' : ' Storan pelayar disekat, jadi rekod ini hilang apabila halaman ditutup.') + '</span>';
}
function bindRetry(container, cb) {
  container.addEventListener('click', function (e) {
    if (!e.target.closest('[data-retry]')) return;
    var box = e.target.closest('[data-save]') || container;
    box.innerHTML = saveStatusHTML(null);
    var req = box.getAttribute('data-req');
    API.flush().then(function () {
      var st = req ? API.statusOf(req) : { state: (Store.get('outbox', []) || []).length ? 'pending' : 'saved' };
      box.innerHTML = saveStatusHTML(st); if (cb) cb(st);
    });
  });
}

/* ---- 06-charts.js ---- */
/* =====================================================================
   CARTA SVG RINGAN (tiada pustaka luar)
   Warna: siri kelas --s1/--s2/--s3 (disahkan untuk permukaan gelap),
   status betul/salah = hijau/merah dengan label teks.
   ===================================================================== */
var CHART_COL = { s1: '#338ced', s2: '#e76624', s3: '#00a888', good: '#0aac23', bad: '#dc3c3d', likert: ['#1b64be', '#6aabf1', '#f08a8a', '#dc3c3d'] };
function tipAttr(t) { return ' data-tip="' + esc(t) + '" tabindex="0"'; }

/* Bar mendatar: rows = [{label, value, text?}] ; max lalai 100 */
function hBar(rows, opt) {
  opt = opt || {}; var max = opt.max || Math.max(1, Math.max.apply(null, rows.map(function (r) { return r.value; })));
  var lw = opt.labelW || 170, W = 640, bh = 24, gap = 12, H = rows.length * (bh + gap) + 6, bw = W - lw - 70;
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.title || 'Carta bar') + '">';
  rows.forEach(function (r, i) {
    var y = i * (bh + gap) + 3, w = Math.max(r.value > 0 ? 4 : 0, r.value / max * bw);
    s += '<text x="' + (lw - 8) + '" y="' + (y + bh * .7) + '" text-anchor="end">' + esc(r.label) + '</text>' +
      '<rect x="' + lw + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="4" fill="rgba(255,255,255,.05)"/>' +
      '<rect x="' + lw + '" y="' + y + '" width="' + w + '" height="' + bh + '" rx="4" fill="' + (r.color || opt.color || CHART_COL.s1) + '"' + tipAttr(r.label + ': ' + (r.text || r.value)) + '/>' +
      '<text class="v" x="' + (lw + w + 8) + '" y="' + (y + bh * .7) + '">' + esc(r.text != null ? r.text : r.value) + '</text>';
  });
  return s + '</svg>';
}

/* Bar berkumpulan menegak: cats = ['L1',..], series = [{name,color,values:[..]}] */
function groupBar(cats, series, opt) {
  opt = opt || {}; var max = opt.max || 100, W = 640, H = 260, pl = 36, pb = 34, pt = 10, cw = (W - pl) / cats.length, n = series.length;
  var bw = Math.min(30, (cw - 18 - (n - 1) * 2) / n);
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.title || 'Carta bar berkumpulan') + '">';
  [0, 25, 50, 75, 100].forEach(function (g) { var y = pt + (H - pt - pb) * (1 - g / max);
    s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.08)"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + g + '</text>'; });
  cats.forEach(function (c, ci) {
    var x0 = pl + ci * cw + (cw - (n * bw + (n - 1) * 2)) / 2;
    series.forEach(function (se, si) { var v = se.values[ci]; if (v == null) return; var h = (H - pt - pb) * (v / max), x = x0 + si * (bw + 2), y = H - pb - h;
      s += '<path d="M' + x + ' ' + (H - pb) + 'V' + (y + 4) + 'q0-4 4-4h' + (bw - 8) + 'q4 0 4 4V' + (H - pb) + 'z" fill="' + se.color + '"' + tipAttr(se.name + ' · ' + c + ': ' + v) + '/>'; });
    s += '<text x="' + (pl + ci * cw + cw / 2) + '" y="' + (H - 12) + '" text-anchor="middle">' + esc(c) + '</text>';
  });
  return s + '</svg>' + legend(series);
}
function legend(series) { return '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>'; }

/* Donat: parts = [{label,value,color}] */
function donut(parts, opt) {
  opt = opt || {}; var tot = parts.reduce(function (a, p) { return a + p.value; }, 0), R = 70, r = 44, cx = 90, cy = 90, a0 = -Math.PI / 2;
  var s = '<div class="row" style="align-items:center"><svg class="chart" viewBox="0 0 180 180" style="max-width:180px" role="img" aria-label="' + esc(opt.title || 'Carta pai') + '">';
  if (!tot) s += '<circle cx="90" cy="90" r="57" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="26"/>';
  parts.forEach(function (p) {
    if (!p.value) return; var a1 = a0 + p.value / tot * Math.PI * 2; if (p.value === tot) a1 = a0 + Math.PI * 2 - .0001;
    var big = a1 - a0 > Math.PI ? 1 : 0, gapA = parts.filter(function (x) { return x.value; }).length > 1 ? .02 : 0;
    var b0 = a0 + gapA, b1 = a1 - gapA;
    var P = function (ang, rad) { return (cx + rad * Math.cos(ang)).toFixed(2) + ' ' + (cy + rad * Math.sin(ang)).toFixed(2); };
    s += '<path d="M' + P(b0, R) + 'A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + P(b1, R) + 'L' + P(b1, r) + 'A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + P(b0, r) + 'z" fill="' + p.color + '"' + tipAttr(p.label + ': ' + p.value + ' (' + pct(p.value, tot) + '%)') + '/>';
    a0 = a1;
  });
  s += '<text x="90" y="88" text-anchor="middle" class="v" style="font-size:22px">' + (opt.center != null ? esc(opt.center) : tot) + '</text><text x="90" y="108" text-anchor="middle">' + esc(opt.centerLabel || 'jumlah') + '</text></svg>';
  s += '<div class="legend" style="flex-direction:column;gap:6px">' + parts.map(function (p) { return '<span><i style="background:' + p.color + '"></i>' + esc(p.label) + ': <b>' + p.value + '</b> (' + pct(p.value, tot) + '%)</span>'; }).join('') + '</div></div>';
  return s;
}

/* Bar bertindan 100% (skala Likert) : rows = [{label, counts:[SS,S,TS,STS]}] */
function likertBars(rows) {
  var W = 640, lw = 190, bh = 22, gap = 10, H = rows.length * (bh + gap) + 4, bw = W - lw - 10;
  var names = ['Sangat Setuju', 'Setuju', 'Tidak Setuju', 'Sangat Tidak Setuju'];
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Taburan jawapan mengikut kategori">';
  rows.forEach(function (r, i) {
    var y = i * (bh + gap) + 2, tot = r.counts.reduce(function (a, b) { return a + b; }, 0), x = lw;
    s += '<text x="' + (lw - 8) + '" y="' + (y + bh * .72) + '" text-anchor="end">' + esc(r.label) + '</text>';
    if (!tot) { s += '<rect x="' + lw + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="4" fill="rgba(255,255,255,.05)"/>'; return; }
    r.counts.forEach(function (c, k) { if (!c) return; var w = c / tot * bw;
      s += '<rect x="' + (x + 1) + '" y="' + y + '" width="' + Math.max(1, w - 2) + '" height="' + bh + '" rx="3" fill="' + CHART_COL.likert[k] + '"' + tipAttr(r.label + ' · ' + names[k] + ': ' + c + ' (' + pct(c, tot) + '%)') + '/>';
      if (w > 34) s += '<text x="' + (x + w / 2) + '" y="' + (y + bh * .72) + '" text-anchor="middle" style="fill:#fff;font-weight:800">' + pct(c, tot) + '%</text>';
      x += w; });
  });
  return s + '</svg>' + legend(names.map(function (n, k) { return { name: n, color: CHART_COL.likert[k] }; }));
}

/* Tooltip kongsi untuk semua carta */
(function () {
  var tip = null;
  function show(el, x, y) { if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - 250, x + 12) + 'px'; tip.style.top = (y + 12) + 'px'; }
  function hide() { if (tip) tip.style.display = 'none'; }
  document.addEventListener('pointermove', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener('focusin', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) { var r = el.getBoundingClientRect(); show(el, r.left, r.bottom); } });
  document.addEventListener('focusout', hide);
})();

function normAns(s) { return String(s || '').toUpperCase().replace(/[^A-Z]/g, ''); }
function lev(a, b) {
  var m = a.length, n = b.length, d = []; for (var i = 0; i <= m; i++) { d[i] = [i]; } for (var j = 0; j <= n; j++) d[0][j] = j;
  for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
/* pulangkan {ok, exact, canonical} */
function checkWord(input, item) {
  var x = normAns(input), canon = item.ans[0];
  if (!x) return { ok: false, canonical: canon };
  for (var i = 0; i < item.ans.length; i++) if (x === normAns(item.ans[i])) return { ok: true, exact: true, canonical: canon };
  for (i = 0; i < item.ans.length; i++) { var a = normAns(item.ans[i]); if (a.length >= 6 && lev(x, a) <= 1) return { ok: true, exact: false, canonical: canon }; }
  return { ok: false, canonical: canon };
}

}

  }
  function defeat() {
    done = true;
    levelComplete('FINAL', result(false), { game: G, title: 'Si Pemadam Melarikan Diri!', extra: '<p>Nyawa habis. Ulang kaji Learning Hub, kemudian cuba lagi. Soalan baharu akan dipilih.</p>', retry: function () { render(); } });

/* Laporan maklum balas (dikongsi dengan Mission Intelligence) */
function feedbackReport(d, teacher) {
  if (!d || !d.total) return '<div class="empty-state">No feedback responses yet. Belum ada maklum balas dihantar.</div>';
  var all = [0, 0, 0, 0], catRows = [], sumScore = 0, nAns = 0;
  FEEDBACK_Q.forEach(function (c) {
    var cc = [0, 0, 0, 0];
    c.items.forEach(function (it) { var arr = d.items[it[0]] || [0, 0, 0, 0];   // indeks 0=nilai1 … 3=nilai4
      cc[0] += arr[3]; cc[1] += arr[2]; cc[2] += arr[1]; cc[3] += arr[0];
      for (var k = 0; k < 4; k++) { sumScore += arr[k] * (k + 1); nAns += arr[k]; } });
    for (var k = 0; k < 4; k++) all[k] += cc[k];
    var tot = cc[0] + cc[1] + cc[2] + cc[3], mean = tot ? (cc[0] * 4 + cc[1] * 3 + cc[2] * 2 + cc[3]) / tot : 0;
    catRows.push({ label: c.cat + '. ' + c.name, counts: cc, mean: mean, agree: pct(cc[0] + cc[1], tot) });
  });
  var avg = nAns ? sumScore / nAns : 0;
  var itemRows = [];
  FEEDBACK_Q.forEach(function (c) { c.items.forEach(function (it) { var a = d.items[it[0]] || [0, 0, 0, 0], t = a[0] + a[1] + a[2] + a[3];
    itemRows.push('<tr><td><b>' + it[0] + '</b></td><td>' + esc(it[1]) + '</td><td>' + pct(a[3], t) + '%</td><td>' + pct(a[2], t) + '%</td><td>' + pct(a[1], t) + '%</td><td>' + pct(a[0], t) + '%</td><td>' + (t ? ((a[3] * 4 + a[2] * 3 + a[1] * 2 + a[0]) / t).toFixed(2) : '-') + '</td></tr>'); }); });
  return '<div class="grid g4"><div class="card stat"><div class="k">Jumlah maklum balas</div><div class="v">' + d.total + '</div></div>' +
    '<div class="card stat"><div class="k">Purata kepuasan</div><div class="v">' + avg.toFixed(2) + ' / 4</div><div class="s">' + Math.round((avg - 1) / 3 * 100) + '% indeks kepuasan</div></div>' +
    '<div class="card stat"><div class="k">Setuju + Sangat Setuju</div><div class="v">' + pct(all[0] + all[1], all[0] + all[1] + all[2] + all[3]) + '%</div></div>' +
    '<div class="card stat"><div class="k">Cadangan bertulis</div><div class="v">' + (d.suggestionCount || 0) + '</div></div></div>' +
    '<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Taburan keseluruhan</h3>' + donut(LIKERT.map(function (L, k) { return { label: L[1], value: all[k], color: CHART_COL.likert[k] }; }), { title: 'Taburan keseluruhan jawapan', centerLabel: 'jawapan' }) + '</div>' +
    '<div class="card"><h3>Analisis kategori (min 1–4)</h3>' + hBar(catRows.map(function (r) { return { label: r.label.slice(0, 26), value: +r.mean.toFixed(2), text: r.mean.toFixed(2) + ' · ' + r.agree + '% setuju' }; }), { max: 4, labelW: 200, color: CHART_COL.s1, title: 'Purata skor setiap kategori' }) + '</div></div>' +
    '<div class="card" style="margin-top:16px"><h3>Peratus jawapan mengikut kategori</h3>' + likertBars(catRows) + '</div>' +
    '<h3>Jadual setiap item</h3><div class="table-wrap"><table><thead><tr><th>Item</th><th>Pernyataan</th><th>SS</th><th>S</th><th>TS</th><th>STS</th><th>Min</th></tr></thead><tbody>' + itemRows.join('') + '</tbody></table></div>' +
    '<h3>Ringkasan cadangan murid</h3>' + ((d.keywords && d.keywords.length) ? '<p class="small muted">Kata kunci paling kerap dalam cadangan:</p><div class="row">' + d.keywords.map(function (k) { return '<span class="chip">' + esc(k.word) + ' × ' + k.count + '</span>'; }).join('') + '</div>' : '<p class="muted">Belum ada cadangan bertulis.</p>') +
    (teacher && d.suggestions && d.suggestions.length ? '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Tarikh</th><th>Jenis</th><th>Cadangan</th></tr></thead><tbody>' + d.suggestions.map(function (s) { return '<tr><td>' + esc(s.date) + '</td><td>' + (s.anonymous ? 'Tanpa nama' : esc(s.studentId + ' · ' + s.className)) + '</td><td>' + esc(s.text) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
    '<p class="small muted">Dikemas kini: ' + fmtDate(d.updated) + '. Semua angka dikira daripada maklum balas sebenar yang dihantar.</p>';
}

function sampleData() {
  var students = [], attempts = [], now = Date.now(), n = 0;
  CONFIG.CLASSES.forEach(function (c, ci) {

      var reach = (n * 7) % 5;
      ['HUB', 'L1', 'L2', 'L3', 'FINAL'].slice(0, reach + 1).forEach(function (a, ai) {
        var tries = 1 + ((n + ai) % 2);
        for (var t = 0; t < tries; t++) { var sc = 45 + ((n * 13 + ai * 17 + t * 9 + ci * 5) % 55), c2 = 5 + (n + ai) % 8, w = (n + ai + t) % 5;
          attempts.push({ attemptId: 'S' + attempts.length, studentId: sid, className: c, activity: a, score: sc, maxScore: 100, percent: sc, correct: c2, wrong: w,
            durationSec: 120 + ((n * 37 + ai * 51) % 400), completed: t === tries - 1, details: 'SAMPLE', createdAt: new Date(now - 86400000 * (4 - ai) - t * 600000).toISOString() }); } });
    } });
  var items = {}; FEEDBACK_Q.forEach(function (c) { c.items.forEach(function (it, k) { items[it[0]] = [1, 2 + k % 2, 6, 7 + (k % 3)]; }); });
  return { students: students, attempts: attempts, feedback: { total: 16, items: items, keywords: [{ word: 'contoh', count: 3 }], suggestionCount: 1, suggestions: [{ date: 'SAMPLE', anonymous: true, text: 'Contoh cadangan (SAMPLE DATA)' }], updated: new Date().toISOString() },
    lastUpdate: new Date().toISOString(), serverTime: new Date().toISOString() };
